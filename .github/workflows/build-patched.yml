name: Build patched Seal

on:
  push:
    branches: [js-runtime-fix]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build quickjs-ng (arm64-v8a)
        run: |
          set -euxo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}}"
          git clone --depth 1 https://github.com/quickjs-ng/quickjs "$RUNNER_TEMP/quickjs"
          cmake -S "$RUNNER_TEMP/quickjs" -B "$RUNNER_TEMP/quickjs-build" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/quickjs-build" -j"$(nproc)"
          QJS_BIN="$(find "$RUNNER_TEMP/quickjs-build" -maxdepth 2 -type f -name qjs ! -name '*.a' | head -n1)"
          echo "Found qjs executable: $QJS_BIN"
          test -n "$QJS_BIN"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$QJS_BIN" app/src/main/jniLibs/arm64-v8a/libqjs.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" app/src/main/jniLibs/arm64-v8a/libqjs.so || true
          file app/src/main/jniLibs/arm64-v8a/libqjs.so
          ls -l app/src/main/jniLibs/arm64-v8a/

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleGenericDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: seal-patched
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
